name: Docker Build & Push

# 언제 실행할지: 'main' 브랜치에 코드가 push 되면 실행
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 깃허브에 있는 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 도커 허브 로그인 (아까 등록한 비밀번호 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. 도커 이미지 빌드하고 도커 허브에 올리기(Push)
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # ★ minxseox 아이디로 이미지 이름 생성
          tags: minxseox/my-expo-web:latest
