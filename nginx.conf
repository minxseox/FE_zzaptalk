server {
    listen 80;
    
    root /usr/share/nginx/html; # ✅ dist 폴더 내용물이 들어갈 곳
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ✅ 새로고침 시 index.html로 연결 (React Router 필수)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ 정적 파일(JS, CSS)이 없을 때 404 처리 (새로고침 오류 방지 2중 장치)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    # ✅ API 프록시
    location /api/ {
        proxy_pass http://zzaptalk-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ 소켓 프록시
    location /ws {
        proxy_pass http://zzaptalk-backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
}